<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course</title>
    <link rel="stylesheet" href="course4.css">
</head>
<body>
    <div class="wrapper">
        <div class="left">
            <img src="../../img/Info.png" alt="" class="info">
        </div>
        <div class="right">
            <img src="../../img/Logo.png" alt="">
            <p class="right_text">Join us and get more benefits. We promise to keep your data safely. </p>
            <div class="email">
                <p class="email_text">Email Address</p>
                <img src="../../img/mail_outline_24px.png   " alt="" class="email_img">
            </div>
            <div class="email">
                <p class="email_text">Password</p>
                <img src="../../img/lock_24px.png   " alt="" class="email_img">
            </div>
            <div class="login">
                <p class="login_text">Login</p>
            </div>
            <p>or you can</p>
            <div class="facebook">
                <img src="../../img/Facebook.png" alt="">
                <p class="facebook_text">Continue with Facebook</p>
            </div>
            <div class="apple">
                <img src="../../img/Apple.png" alt="">
                <p>Continue with Apple</p>
            </div>
            <div class="google">
                <img src="../../img/Google.png" alt="">
                <p>Continue with Google</p>
            </div>
            <p class="text">Need an Account? <span class="green">Sign Up</span></p>
        </div>
    </div>
</body>
</html>
